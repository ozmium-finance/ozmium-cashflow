# Merged on top of sandbox-defaults.conf (dpm sandbox's own default
# topology, extracted from the canton-open-source jar at image build
# time), on the deployed server only, via canton-entrypoint.sh:
#
#   java -jar canton-open-source-*.jar daemon \
#     -c sandbox-defaults.conf,canton-production.conf \
#     --bootstrap canton-bootstrap.canton
#
# Local dev is untouched -- that's still plain `dpm sandbox`, in-memory,
# same as always. This file, sandbox-defaults.conf, and
# canton-bootstrap.canton only apply to the deployed container.
#
# Why this doesn't just use `dpm sandbox --config ... --json-api-port ...
# --dar ...` like it used to: see the comment at the top of
# canton-entrypoint.sh and canton-bootstrap.canton. Short version: dpm
# sandbox's own bootstrap script isn't safe to re-run against storage
# that already has state in it (every restart after the first crashed the
# whole node), and the `sandbox` command has no way to swap in a fixed
# version of that script, so this drops to Canton's lower-level `daemon`
# command instead, which does. That means this file has to do a couple of
# things `--json-api-port`/`--dar` used to do for free -- see the
# http-ledger-api and alpha-dynamic.dars blocks below.
#
# What this changes, and why:
#
# 1. Storage: in-memory -> Postgres, for all three nodes (participant
#    "sandbox", sequencer "sequencer1", mediator "mediator1"). All three
#    need to survive a restart together, not just the participant -- if
#    only the participant's ledger state persisted, it would reconnect
#    after a restart to a sequencer/mediator that had forgotten the
#    domain's topology, which breaks things.
#
#    Each node needs its own actual database, not just its own schema
#    within a shared database -- Canton's own startup validation
#    rejects nodes that resolve to the same (host, port, database,
#    user) tuple, even if `schema` differs, with:
#      "Nodes ... share same DB access: DbAccess(...)"
#    (found this out from a real failed deploy, not the docs -- Digital
#    Asset's example config uses separate databases too, this file just
#    originally tried to cut a corner that Canton doesn't actually
#    allow). So this expects three databases to already exist on your
#    Postgres instance -- see docker-compose.yml for how their names
#    are derived from POSTGRES_DB.
#
# 2. Networking: the JSON API (what the dashboard's API route talks to)
#    is explicitly enabled on port 7575 and binds to 0.0.0.0 instead of
#    the default 127.0.0.1/6864, so it's reachable from the dashboard's
#    own container. (Previously `--json-api-port 7575` did this for us;
#    now that we're not using the `sandbox` command, it has to be spelled
#    out here.) The gRPC Ledger API and Admin API are left on their
#    defaults (localhost-only) since nothing outside the box needs them
#    -- smaller exposed surface.
#
# 3. DAR upload: previously `--dar <path>` on the `sandbox` command
#    handled this. The `daemon` command has no equivalent flag, so this
#    uses Canton's declarative-state API instead -- it reconciles the
#    ledger's uploaded DARs to match this list on every startup, which is
#    idempotent by design (already-uploaded is a no-op), unlike scripting
#    the upload ourselves in canton-bootstrap.canton would have been.
#
# Connection details come from environment variables (POSTGRES_HOST,
# POSTGRES_PORT, POSTGRES_DB_SEQUENCER, POSTGRES_DB_MEDIATOR,
# POSTGRES_DB_PARTICIPANT, POSTGRES_USER, POSTGRES_PASSWORD) rather than
# being hardcoded here, so this file can be committed without leaking
# the database password. docker-compose.yml derives the three DB name
# variables from a single POSTGRES_DB so only one GitHub variable is
# needed; the deploy workflow sets these from GitHub secrets/variables
# when it starts the container.
#
# Before the first deploy: all three databases need to already exist on
# the Postgres instance (Canton's `migrate-and-start` creates tables
# inside a database, it doesn't create the database itself), and
# POSTGRES_USER needs CREATE privileges on each. Scaleway's default
# managed-database user already has this on its own instance, so
# usually just running `CREATE DATABASE ...` three times as that user
# is enough -- see the deploy runbook / chat history for the exact
# commands used the first time this was set up.

canton {
  sequencers.sequencer1.storage {
    type = postgres
    config {
      dataSourceClassName = "org.postgresql.ds.PGSimpleDataSource"
      properties = {
        serverName = ${POSTGRES_HOST}
        portNumber = ${POSTGRES_PORT}
        databaseName = ${POSTGRES_DB_SEQUENCER}
        user = ${POSTGRES_USER}
        password = ${POSTGRES_PASSWORD}
        ssl = true
        sslmode = "require"
      }
    }
    parameters.migrate-and-start = true
  }

  mediators.mediator1.storage {
    type = postgres
    config {
      dataSourceClassName = "org.postgresql.ds.PGSimpleDataSource"
      properties = {
        serverName = ${POSTGRES_HOST}
        portNumber = ${POSTGRES_PORT}
        databaseName = ${POSTGRES_DB_MEDIATOR}
        user = ${POSTGRES_USER}
        password = ${POSTGRES_PASSWORD}
        ssl = true
        sslmode = "require"
      }
    }
    parameters.migrate-and-start = true
  }

  participants.sandbox {
    storage {
      type = postgres
      config {
        dataSourceClassName = "org.postgresql.ds.PGSimpleDataSource"
        properties = {
          serverName = ${POSTGRES_HOST}
          portNumber = ${POSTGRES_PORT}
          databaseName = ${POSTGRES_DB_PARTICIPANT}
          user = ${POSTGRES_USER}
          password = ${POSTGRES_PASSWORD}
          ssl = true
          sslmode = "require"
        }
      }
      parameters.migrate-and-start = true
    }

    http-ledger-api {
      enabled = true
      address = "0.0.0.0"
      port = 7575
    }
  }

  parameters {
    enable-alpha-state-via-config = yes
    state-refresh-interval = 5s
  }

  participants.sandbox.alpha-dynamic.dars = [
    { location = "/app/.daml/dist/ozmium-cashflow-0.3.0.dar" }
  ]
}
