# Runs ONLY on the Scaleway Instance -- the deploy workflow copies this
# file there and runs `docker compose up -d`. Not meant for local dev;
# local dev is still the plain `dpm sandbox` + `npm run dev` two-terminal
# workflow described in the root README and dashboard/README.md.
#
# Images are pre-built in GitHub Actions and pushed to Scaleway Container
# Registry -- this file only pulls and runs them, it doesn't build
# anything on the server itself.
#
# Expects a .env file alongside it (the deploy workflow writes this from
# GitHub secrets/variables) with:
#   SCW_REGISTRY, IMAGE_TAG, CADDY_DOMAIN,
#   POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#
# Canton requires each of its three nodes (participant, sequencer,
# mediator) to have its own separate database -- see the comment at the
# top of canton-production.conf for why. Rather than needing three
# separate GitHub variables, the three database names are derived here
# from the one POSTGRES_DB value by suffixing it (Compose's own
# ${VAR}suffix interpolation, resolved from .env before the container
# ever starts) -- so POSTGRES_DB=rdb becomes rdb_participant1,
# rdb_sequencer1, rdb_mediator1. All three need to already exist on the
# Postgres server before this is run for the first time.
#
# Caddy sits in front of the dashboard and is the only thing that binds
# host ports 80/443 -- it terminates TLS (auto-provisioned via Let's
# Encrypt for CADDY_DOMAIN) and reverse-proxies to the dashboard container
# over Compose's internal network. The dashboard itself is no longer
# published to the host directly. caddy_data is a named volume so the
# issued certificate survives `docker compose up` being re-run on every
# deploy -- without it we'd re-request a cert from Let's Encrypt every
# push and eventually hit their rate limit.

services:
  canton:
    image: ${SCW_REGISTRY}/canton:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB_PARTICIPANT: ${POSTGRES_DB}_participant1
      POSTGRES_DB_SEQUENCER: ${POSTGRES_DB}_sequencer1
      POSTGRES_DB_MEDIATOR: ${POSTGRES_DB}_mediator1
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Only the JSON API needs to be reachable at all, and only from the
    # dashboard container -- not published to the host, Compose's
    # internal network already lets the dashboard container reach it at
    # http://canton:7575.
    expose:
      - "7575"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7575/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  dashboard:
    image: ${SCW_REGISTRY}/dashboard:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      canton:
        condition: service_healthy
    environment:
      # Fallback target -- only used if LEDGER_TARGET below isn't
      # "devnet" (see DEVNET_MODE in pages/api/v2/[...path].js). Left in
      # place even with devnet wired up so this container still has
      # somewhere to point if the devnet vars are ever unset.
      JSON_API_HOST: canton
      JSON_API_PORT: "7575"
      # CIP-56/DFNS wiring -- real ozmium-devnet-1 validator instead of
      # the bundled canton container above, plus real DFNS-custodied
      # wallet creation on CantonTestnet. All eight come from GitHub
      # Actions secrets/variables via the .env the deploy workflow writes
      # -- see the "one-time setup" comment block at the bottom of
      # .github/workflows/deploy.yml.
      LEDGER_TARGET: ${LEDGER_TARGET}
      LEDGER_API_URL: ${LEDGER_API_URL}
      LEDGER_API_CLIENT_ID: ${LEDGER_API_CLIENT_ID}
      LEDGER_API_CLIENT_SECRET: ${LEDGER_API_CLIENT_SECRET}
      LEDGER_API_TOKEN_URL: ${LEDGER_API_TOKEN_URL}
      LEDGER_API_SCOPE: ${LEDGER_API_SCOPE}
      DFNS_SERVICE_ACCOUNT_PRIVATE_KEY_BASE64: ${DFNS_SERVICE_ACCOUNT_PRIVATE_KEY_BASE64}
      DFNS_SERVICE_ACCOUNT_AUTH_TOKEN: ${DFNS_SERVICE_ACCOUNT_AUTH_TOKEN}
      DFNS_CREDENTIAL_ID: ${DFNS_CREDENTIAL_ID}
      DFNS_ORG_ID: ${DFNS_ORG_ID}
      DFNS_API_URL: ${DFNS_API_URL}
      # Week 4 -- real CIP-56 settlement (pages/api/dfns/transfer-cip56.js).
      # None of these four are secret in the credential sense (they're
      # public on-ledger identifiers / a wallet id, not private keys), so
      # they come from GitHub Variables rather than Secrets -- see the
      # "one-time setup" comment block at the bottom of deploy.yml.
      DFNS_ISSUER_WALLET_ID: ${DFNS_ISSUER_WALLET_ID}
      DFNS_OZM_INSTRUMENT_ID: ${DFNS_OZM_INSTRUMENT_ID}
      DFNS_OZM_INSTRUMENT_ADMIN: ${DFNS_OZM_INSTRUMENT_ADMIN}
      DFNS_OZM_DECIMALS: ${DFNS_OZM_DECIMALS}
      # Required for every DFNS Canton wallet this app creates to actually
      # be usable -- see .env.local.example's DFNS_CANTON_VALIDATOR_ID
      # comment for why (wallets are unusable until activated on one).
      DFNS_CANTON_VALIDATOR_ID: ${DFNS_CANTON_VALIDATOR_ID}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - dashboard
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
