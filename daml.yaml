# Ozmium Cashflow — Canton Mission build
#
# Targets Daml 3.5.x, since that's what the live Canton Network actually
# runs these days. That means no `daml` CLI (gone as of 3.5, use `dpm`
# from get.digitalasset.com instead) and no contract keys — see the
# "Contract keys and Canton 3.x" bit in README.md for why none of the
# templates in here use key/maintainer.
#
# sdk-version below was the latest stable as of writing (June 2026) —
# double check with `dpm sdk list` since I couldn't hit
# get.digitalasset.com from here to confirm it.
# version bumped 0.1.0 -> 0.2.0 for the Week 4 CIP-56/DFNS settlement
# change (Settlement.daml grew a field, Settlement_MarkPaid's signature
# changed) -- v0.1.0 was already vetted on devnet, and Canton rejects
# uploading a different package hash under a name+version that's
# already known (KNOWN_PACKAGE_VERSION). Bumped again 0.2.0 -> 0.3.0 for
# Week 5's new Ozmium.ProofLog module -- same reasoning, any change
# anywhere under daml/ changes this single package's hash, not just
# changes to the module you're actually touching. Every place that
# references the literal ozmium-cashflow-<version>.dar filename has to
# move in lockstep -- see deploy.yml, both data-dependencies in
# tests/scenarios and integration/mock-attestor, and the READMEs.
# Bump this again next time a template/choice shape changes, not just
# when it feels like a new release.
sdk-version: 3.5.2
name: ozmium-cashflow
source: daml
version: 0.3.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
