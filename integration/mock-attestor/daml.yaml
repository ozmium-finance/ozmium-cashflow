# MockAttestor.daml is compiled as its own tiny package (same reasoning as
# tests/scenarios/daml.yaml) so it can be run with `dpm script` against a
# live sandbox/participant without pulling the demo-integration code into
# the main contract package.
#
# Build order: `dpm build` at the repo root first, then `dpm build` here
# (or `dpm build --all` from the repo root, see multi-package.yaml).
sdk-version: 3.5.3
name: ozmium-mock-attestor
source: .
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../../.daml/dist/ozmium-cashflow-0.1.0.dar
