# Same deal as tests/scenarios/daml.yaml — its own package so
# MockAttestor.daml can run via `dpm script` without the demo-integration
# code ending up inside the main contract package.
#
# Build the repo root first, then this one (`dpm build --all` from the
# root does both, see multi-package.yaml).
sdk-version: 3.5.3
name: ozmium-mock-attestor
source: .
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../../.daml/dist/ozmium-cashflow-0.1.0.dar
