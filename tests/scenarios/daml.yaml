# Own little package instead of living inside daml/ as extra modules —
# keeps tests in their own top-level folder like the build guide wants,
# and pulls in the compiled main package via data-dependencies.
#
# Build order matters here:
#   1. repo root:        dpm build
#   2. this directory:   dpm test
#
# Step 1 has to happen first, otherwise ../../.daml/dist/ozmium-cashflow-0.2.0.dar
# doesn't exist yet and the data-dependency below can't resolve. Bump the
# version in the root daml.yaml and you'll need to update that filename
# too. (Or just run `dpm build --all` from the repo root and skip doing
# this by hand — see multi-package.yaml.)
sdk-version: 3.5.2
name: ozmium-cashflow-tests
source: .
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../../.daml/dist/ozmium-cashflow-0.2.0.dar
