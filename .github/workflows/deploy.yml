name: Deploy

# Runs on every push to main (i.e. every merge). Two jobs:
#   1. build-and-push -- builds both images, pushes to Scaleway Container
#      Registry. Runs immediately, no gate.
#   2. deploy -- SSHes into the Scaleway Instance and restarts the stack
#      with the new images. Gated by the "production" GitHub Environment
#      below, so it pauses for a manual approval before running -- see
#      the note at the bottom of this file for the one-time setup step
#      that turns that gate on.
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to Scaleway Container Registry
        run: |
          REGISTRY_HOST="$(echo "${{ vars.SCW_REGISTRY }}" | cut -d/ -f1)"
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "$REGISTRY_HOST" -u nologin --password-stdin

      - name: Build canton image
        run: |
          docker build -f deploy/Dockerfile.canton \
            -t "${{ vars.SCW_REGISTRY }}/canton:${{ steps.tag.outputs.value }}" \
            -t "${{ vars.SCW_REGISTRY }}/canton:latest" \
            .

      # CIP-56/DFNS wiring -- gets the current DAR onto devnet's
      # participant *before* the (approval-gated) deploy job below ever
      # flips production over to LEDGER_TARGET=devnet, so there's no
      # window where production points at devnet but devnet doesn't have
      # the package yet. Pulls the DAR straight out of the canton image
      # instead of reinstalling dpm/JDK on the runner -- that image
      # already ran `dpm build` from this exact commit's daml/ sources
      # one step up, no reason to duplicate the toolchain setup to get
      # the same file a second way. Verified manually against devnet
      # before wiring this in: `dpm build` -> get a client-credentials
      # token from LEDGER_API_TOKEN_URL -> POST the raw DAR bytes to
      # {LEDGER_API_URL}/v2/packages with that token as a Bearer header
      # -- confirmed the package actually registered by checking the
      # Five North dashboard's Packages list afterward, not just trusting
      # the `{}` response (Canton's JSON API returns that on success with
      # no further detail, so the dashboard check was the real proof).
      - name: Upload DAR to devnet
        run: |
          id=$(docker create "${{ vars.SCW_REGISTRY }}/canton:${{ steps.tag.outputs.value }}")
          docker cp "$id":/app/.daml/dist/ozmium-cashflow-0.2.0.dar ./ozmium-cashflow.dar
          docker rm "$id" > /dev/null

          token_response=$(curl -sS -X POST "${{ vars.LEDGER_API_TOKEN_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "grant_type=client_credentials&client_id=${{ vars.LEDGER_API_CLIENT_ID }}&client_secret=${{ secrets.LEDGER_API_CLIENT_SECRET }}&scope=${{ vars.LEDGER_API_SCOPE }}")
          token=$(echo "$token_response" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "Couldn't get a devnet access token. Response was:"
            echo "$token_response"
            exit 1
          fi

          base_url="$(echo "${{ vars.LEDGER_API_URL }}" | sed 's:/*$::')"
          http_code=$(curl -sS -o /tmp/upload-response.json -w "%{http_code}" \
            -X POST "$base_url/v2/packages" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @ozmium-cashflow.dar)
          echo "Upload response ($http_code):"
          cat /tmp/upload-response.json
          if [ "$http_code" -ge 300 ]; then
            exit 1
          fi

      - name: Build dashboard image
        run: |
          docker build -f deploy/Dockerfile.dashboard \
            -t "${{ vars.SCW_REGISTRY }}/dashboard:${{ steps.tag.outputs.value }}" \
            -t "${{ vars.SCW_REGISTRY }}/dashboard:latest" \
            .

      - name: Push images
        run: |
          docker push "${{ vars.SCW_REGISTRY }}/canton:${{ steps.tag.outputs.value }}"
          docker push "${{ vars.SCW_REGISTRY }}/canton:latest"
          docker push "${{ vars.SCW_REGISTRY }}/dashboard:${{ steps.tag.outputs.value }}"
          docker push "${{ vars.SCW_REGISTRY }}/dashboard:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SCW_SSH_PRIVATE_KEY }}

      - name: Trust the Instance's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.SCW_INSTANCE_IP }}" >> ~/.ssh/known_hosts

      - name: Create deploy folder on the Instance
        run: |
          ssh root@${{ vars.SCW_INSTANCE_IP }} "mkdir -p /opt/ozmium-cashflow"

      - name: Copy compose file and Caddyfile to the Instance
        run: |
          scp deploy/docker-compose.yml \
            root@${{ vars.SCW_INSTANCE_IP }}:/opt/ozmium-cashflow/docker-compose.yml
          scp deploy/Caddyfile \
            root@${{ vars.SCW_INSTANCE_IP }}:/opt/ozmium-cashflow/Caddyfile

      - name: Write .env
        run: |
          ssh root@${{ vars.SCW_INSTANCE_IP }} "cat > /opt/ozmium-cashflow/.env" <<EOF
          SCW_REGISTRY=${{ vars.SCW_REGISTRY }}
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          CADDY_DOMAIN=${{ vars.CADDY_DOMAIN }}
          POSTGRES_HOST=${{ vars.SCW_DB_HOST }}
          POSTGRES_PORT=${{ vars.SCW_DB_PORT }}
          POSTGRES_DB=${{ vars.SCW_DB_NAME }}
          POSTGRES_USER=${{ vars.SCW_DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.SCW_DB_PASSWORD }}
          LEDGER_TARGET=devnet
          LEDGER_API_URL=${{ vars.LEDGER_API_URL }}
          LEDGER_API_CLIENT_ID=${{ vars.LEDGER_API_CLIENT_ID }}
          LEDGER_API_CLIENT_SECRET=${{ secrets.LEDGER_API_CLIENT_SECRET }}
          LEDGER_API_TOKEN_URL=${{ vars.LEDGER_API_TOKEN_URL }}
          LEDGER_API_SCOPE=${{ vars.LEDGER_API_SCOPE }}
          DFNS_SERVICE_ACCOUNT_PRIVATE_KEY_BASE64=${{ secrets.DFNS_SERVICE_ACCOUNT_PRIVATE_KEY_BASE64 }}
          DFNS_SERVICE_ACCOUNT_AUTH_TOKEN=${{ secrets.DFNS_SERVICE_ACCOUNT_AUTH_TOKEN }}
          DFNS_CREDENTIAL_ID=${{ secrets.DFNS_CREDENTIAL_ID }}
          DFNS_ORG_ID=${{ vars.DFNS_ORG_ID }}
          DFNS_API_URL=${{ vars.DFNS_API_URL }}
          EOF

      - name: Stop the old stack
        run: |
          ssh root@${{ vars.SCW_INSTANCE_IP }} "cd /opt/ozmium-cashflow && docker compose stop canton" || true

      - name: Reset canton's databases for a clean demo on every deploy
        run: |
          # This project's demo is meant to be clicked through from scratch
          # each time (see the dashboard's own "1. Setup" -> "9. Mark third
          # payment paid" demo controls) -- so every deploy wipes the three
          # canton databases and lets Canton recreate them from nothing,
          # rather than resuming whatever state was left over from the
          # previous deploy. This runs after the old canton container is
          # stopped (above) so nothing still holds a connection to these
          # databases -- Postgres refuses to drop a database that has
          # active connections.
          #
          # This is deliberately separate from the restart-safety fix in
          # canton-bootstrap.canton: that fix protects against *unplanned*
          # restarts (a crash, an OOM-kill, a host reboot) between deploys,
          # so those don't wipe the demo mid-session -- only an actual
          # deploy, via this step, resets it.
          # Plain -h/-p/-U/-d flags + PGPASSWORD/PGSSLMODE env vars instead of
          # a postgresql:// URI -- the DB password can contain characters
          # like # or @ that a URI parser reads as syntax (a bare # in
          # particular gets treated as the start of the URI fragment,
          # silently truncating everything after it, which is exactly what
          # broke this the first time). Flags avoid that entirely.
          ssh root@${{ vars.SCW_INSTANCE_IP }} "docker run --rm \
            -e PGPASSWORD='${{ secrets.SCW_DB_PASSWORD }}' \
            -e PGSSLMODE=require \
            postgres:16 psql \
            -h '${{ vars.SCW_DB_HOST }}' -p '${{ vars.SCW_DB_PORT }}' -U '${{ vars.SCW_DB_USER }}' -d '${{ vars.SCW_DB_NAME }}' \
            -c 'DROP DATABASE IF EXISTS ${{ vars.SCW_DB_NAME }}_participant1;' \
            -c 'DROP DATABASE IF EXISTS ${{ vars.SCW_DB_NAME }}_sequencer1;' \
            -c 'DROP DATABASE IF EXISTS ${{ vars.SCW_DB_NAME }}_mediator1;' \
            -c 'CREATE DATABASE ${{ vars.SCW_DB_NAME }}_participant1;' \
            -c 'CREATE DATABASE ${{ vars.SCW_DB_NAME }}_sequencer1;' \
            -c 'CREATE DATABASE ${{ vars.SCW_DB_NAME }}_mediator1;'"

      - name: Pull and start the new stack
        run: |
          REGISTRY_HOST="$(echo "${{ vars.SCW_REGISTRY }}" | cut -d/ -f1)"
          ssh root@${{ vars.SCW_INSTANCE_IP }} "echo '${{ secrets.SCW_SECRET_KEY }}' | docker login $REGISTRY_HOST -u nologin --password-stdin"
          ssh root@${{ vars.SCW_INSTANCE_IP }} "cd /opt/ozmium-cashflow && docker compose pull && docker compose up -d"

      - name: Clean up old images
        run: |
          # Every deploy pushes a brand-new SHA-tagged image, so without
          # this the Instance's disk fills up over a handful of deploys
          # (that's what just happened -- 37GB of stale images from
          # previous deploys, plus the postgres:16 image pulled fresh for
          # the database-reset step above). -a removes any image not used
          # by a running container, not just dangling/untagged ones, which
          # is what actually clears out old canton/dashboard tags -- safe
          # to run here since compose has already switched every service
          # over to the new images.
          ssh root@${{ vars.SCW_INSTANCE_IP }} "docker image prune -af" || true

# One-time setup this workflow depends on but can't do for itself:
#
# 1. Repo Settings -> Environments -> New environment, name it exactly
#    "production" (matches `environment: production` above), and add
#    yourself (or whoever should approve deploys) as a required
#    reviewer. Once that's saved, every run of the `deploy` job pauses
#    and waits for that approval before touching the server -- the
#    build-and-push job still runs unattended, only the deploy half
#    waits.
#
# 2. This workflow assumes a GitHub Variable SCW_INSTANCE_IP is set to
#    163.172.155.168 (the existing Instance's IP) -- add it under
#    Settings -> Secrets and variables -> Actions -> Variables if it
#    isn't there yet, alongside the SCW_REGISTRY/SCW_DB_* variables
#    already set up.
#
# 3. Also add a GitHub Variable CADDY_DOMAIN set to
#    163-172-155-168.sslip.io -- a free hostname that just resolves to
#    the Instance's own IP, which is all Let's Encrypt needs to issue a
#    certificate (it doesn't have to be a domain anyone owns). Caddy uses
#    this to get HTTPS working automatically -- see deploy/Caddyfile.
#
# 4. CIP-56/DFNS wiring -- this now deploys with LEDGER_TARGET=devnet
#    baked in, so the live site talks to the real ozmium-devnet-1
#    validator instead of the bundled canton container this compose file
#    also still runs (harmless, just unused once devnet mode is on --
#    see JSON_API_HOST/DEVNET_MODE in pages/api/v2/[...path].js for why
#    LEDGER_TARGET alone decides which one wins). Add these under
#    Settings -> Secrets and variables -> Actions:
#
#    Variables: LEDGER_API_URL, LEDGER_API_CLIENT_ID, LEDGER_API_TOKEN_URL,
#      LEDGER_API_SCOPE (daml_ledger_api), DFNS_ORG_ID, DFNS_API_URL
#      (https://api.dfns.io) -- same values as dashboard/.env.local.example
#      documents for local dev.
#    Secrets: LEDGER_API_CLIENT_SECRET, DFNS_SERVICE_ACCOUNT_PRIVATE_KEY_BASE64,
#      DFNS_SERVICE_ACCOUNT_AUTH_TOKEN, DFNS_CREDENTIAL_ID.
#
#    Worth knowing before turning this on: the "reset canton's databases
#    for a clean demo on every deploy" step above only wipes the bundled
#    container's own Postgres databases -- devnet is Alex's shared,
#    persistent network, so once LEDGER_TARGET=devnet is live, the public
#    demo site no longer starts from a guaranteed-empty ledger on every
#    deploy the way it used to. Whatever state exists under these parties
#    on devnet is what visitors will see.
